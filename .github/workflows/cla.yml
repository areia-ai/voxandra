# Asks pull request authors to sign the contributor license agreement by posting
# a comment, using contributor-assistant/github-action (a free CLA bot with no
# separate account).
#
# Signatures are stored on the `cla-signatures` branch, not `master`: every push
# to `master` is a production deploy (site and Convex), and the bot commits each
# new signature. vercel.json turns Vercel deployments off for that branch.
#
# contributor-assistant/github-action was archived in March 2026. Existing
# releases still work, but there won't be future fixes unless someone forks it.
name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          # Individuals sign this by default. Someone contributing on behalf
          # of an employer should read CCLA.md instead (linked from the
          # comment below) and say so when they sign.
          path-to-document: "https://github.com/areia-ai/voxandra/blob/master/ICLA.md"
          branch: "cla-signatures"
          allowlist: carlosmarcial,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before this can be reviewed, please
            read the [Individual Contributor License Agreement](https://github.com/areia-ai/voxandra/blob/master/ICLA.md)
            (or the [Entity Contributor License Agreement](https://github.com/areia-ai/voxandra/blob/master/CCLA.md)
            if you're contributing on behalf of an employer), then sign by
            posting this exact comment:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
